<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1d1f2e" id="tc">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Arrow Escape</title>
<script>try{if(JSON.parse(localStorage.getItem("arrow-prefs")).dark===false)document.documentElement.dataset.theme="light"}catch(e){}</script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark;background:#1d1f2e}
  html,body{margin:0;height:100%;min-height:100vh;min-height:100dvh;overscroll-behavior:none;background:#1d1f2e;color:#c5cbff;font-family:system-ui,sans-serif}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box}
  header{padding:max(28px,env(safe-area-inset-top)) 6px 8px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  select,button,input{background:#2b2d58;color:#c5cbff;border:0;border-radius:10px;padding:9px 14px;font-size:15px}
  button:active{background:#4b5182}
  #players{display:flex;gap:10px;justify-content:center}
  .pl{padding:6px 16px;border-radius:999px;background:transparent;border:1.5px solid rgba(185,170,255,.35);min-width:120px;text-align:center}
  .pl.on{border-color:#b9a8ff}
  .pl.solo{display:flex;align-items:center;justify-content:center;padding:6px 20px;min-width:0}
  .pl.solo svg{width:30px;height:21px;stroke:#e4e6ff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pl.solo .dv{width:1.5px;height:18px;background:rgba(185,170,255,.35)}
  .pl.solo .hearts{font-size:17px;line-height:1;display:flex;align-items:center}
  .hrow{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:22px;vertical-align:middle}
  .hf,.hl{position:relative;display:flex;align-items:center;justify-content:center;width:22px;height:22px;font-size:17px;line-height:1}
  .hl svg{width:20px;height:19px;fill:none;stroke:#8f98d8;stroke-width:1.8;stroke-linejoin:round;opacity:.65}
  .hl i{position:absolute;inset:0;font-style:normal;line-height:1;text-align:center;pointer-events:none}
  .hl.fx svg{animation:hlin .9s ease-out both;animation-delay:var(--d)}
  .hl.fx i{animation:hbreak .9s ease-in both;animation-delay:var(--d)}
  @keyframes hlin{0%,45%{opacity:0}100%{opacity:.65}}
  @keyframes hbreak{0%{transform:scale(1);opacity:1}12%{transform:scale(1.15) rotate(-14deg)}28%{transform:scale(1.15) rotate(14deg)}50%{transform:scale(1.05) rotate(-8deg);opacity:1}100%{transform:translateY(8px) scale(.4) rotate(20deg);opacity:0}}
  .ib{width:56px;padding:9px 0;font-size:22px;line-height:1;background:#2b2d58;border-radius:12px;text-align:center}
  .ib svg{width:26px;height:24px;stroke:#e4e6ff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
  .row{flex-wrap:nowrap;gap:8px;padding:0}
  .row button{height:33px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#3c3d6c;font-size:14.5px;white-space:nowrap}
  .row .ib{flex:0 0 42px;width:42px;font-size:17px}
  .row .ib svg{width:20px;height:19px;stroke-width:2.1}
  .row #back{flex:0 0 34px;width:34px;background:none;justify-content:flex-start}
  .row #back svg{width:24px;height:24px;stroke:#fff;stroke-width:1.7}
  .row .pill{flex:1 1 0;min-width:0;max-width:none}
  #players{margin:0}
  .row{justify-content:center;gap:16px}
  .row #diffBtn,.row #modeBtn{display:none}
  .row button{height:36px;border-radius:11px}
  .row .ib{flex:0 0 46px;width:46px}
  .row .ib svg{width:22px;height:21px}
  .row #back{flex:0 0 28px;width:28px;justify-content:center}
  .row #back svg{width:28px;height:28px}
  .row #players .pl{margin:0}
  .pl.solo{padding:0 18px;height:36px;min-width:127px;box-sizing:border-box}
  .pl b{display:block;font-size:13px;opacity:.8}
  .hearts{color:#ff4b5c;letter-spacing:2px}
  #bar{height:8px;background:#2a2d47;border-radius:4px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#8f98ff;transition:width .2s}
  #status{display:none}
  #roomline{text-align:center;font-size:13px;opacity:.8;min-height:16px}
  #wrap{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;touch-action:none}
  #lobby,#picker{position:fixed;inset:0;background:rgba(10,10,20,.85);display:flex;align-items:center;justify-content:center;z-index:20}
  #lobby[hidden],#picker[hidden]{display:none}
  #popts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:12px 14px;border:2px solid transparent;font-size:17px}
  .opt small{font-size:12px;opacity:.7}
  .opt.on{border-color:#8f98ff;background:#454b78}
  .pill{min-width:104px}
  .pill::after{content:'\00a0\25BE';opacity:.7;font-size:11px}
  .card{background:#2a2d47;border-radius:20px;padding:28px 24px 24px;width:min(340px,90vw);display:flex;flex-direction:column;gap:18px;text-align:center}
  .card h3{margin:0}
  .card input{text-align:center;text-transform:uppercase;letter-spacing:4px;font-size:20px}
  #lmsg{min-height:20px;font-size:14px;color:#ffb3ba;margin:0}
  #flash{position:fixed;inset:0;background:#ff4b5c;opacity:0;pointer-events:none;z-index:4}
  #endcard{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #endcard[hidden]{display:none}
  #endcard{background:rgba(10,10,20,.78);z-index:6}
  .ebig{font-size:46px;line-height:1}
  #esub:empty{display:none}
  #esub{margin:0;opacity:.85;font-size:15px;line-height:1.35}
  .primary{background:#8f98ff;color:#1e1f2e;font-weight:700}
  .primary:active{background:#a7aeff}
  @keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
  .homebox{width:min(250px,68vw);display:flex;flex-direction:column;gap:16px;text-align:center;margin:auto;padding:24px 0}
  .homebox h1{margin:6px 0 38px;font-size:32px;color:#c5cbff;letter-spacing:.2px}
  #home:not([hidden]) .homebox{animation:rise .45s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .homebox p{margin:0;opacity:.75;font-size:14px}
  .logo{width:58px;height:58px;margin:0 auto;display:block}
  #splash{position:fixed;inset:0;z-index:100;background:#1d1f2e;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .3s ease}
  #splash.out{opacity:0;pointer-events:none}
  #splash svg{width:56vmin;height:56vmin;overflow:visible}
  #splash .a1{animation:go1 .55s cubic-bezier(.55,0,.85,.45) .08s forwards}
  #splash .a2{animation:go2 .55s cubic-bezier(.55,0,.85,.45) .14s forwards}
  @keyframes go1{to{transform:translate(1100px,1100px)}}
  @keyframes go2{to{transform:translate(-1100px,-1100px)}}
  @media (prefers-reduced-motion:reduce){#splash .a1,#splash .a2{animation:none}}
  .hlabel{font-size:12px;opacity:.65;text-transform:uppercase;letter-spacing:1.5px;margin-top:6px}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chip{padding:8px 14px;font-size:14px}
  .chip.on{background:#4b5182;box-shadow:inset 0 0 0 2px #8f98ff}
  .big{display:flex;flex-direction:column;gap:3px;padding:16px 14px;font-size:18px;font-weight:600;
    background:linear-gradient(180deg,#363a70,#2a2d5a);border:1px solid rgba(165,175,255,.22);border-radius:16px;
    box-shadow:0 4px 0 #191a3a,0 10px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09);
    transition:transform .09s ease,box-shadow .09s ease,filter .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .big:active{transform:translateY(3px);filter:brightness(1.12);box-shadow:0 1px 0 #191a3a,0 3px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
  .big small{font-weight:400;opacity:.7;font-size:12px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:9}

  .scr{position:fixed;inset:0;background:#1d1f2e;z-index:8;overflow:auto;-webkit-overflow-scrolling:touch}
  .scr[hidden]{display:none}
  #home{align-items:center;justify-content:center}
  #home:not([hidden]){display:flex}
  .scr:not(#home){padding:max(26px,env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom))}
  .stitle{margin:6px 0 18px;text-align:center;font-size:20px;font-weight:700;color:#e4e6ff}
  #tabs{position:fixed;left:16px;right:16px;bottom:max(12px,env(safe-area-inset-bottom));height:64px;z-index:9;display:flex;background:#2a2d47;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);padding:6px}
  #tabs[hidden]{display:none}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border-radius:16px;padding:0;font-size:11.5px;color:#8a8fc4;touch-action:manipulation}
  .tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:#8f98ff;background:rgba(143,152,255,.13)}
  .tab:active{background:rgba(143,152,255,.2)}
  #lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:420px;margin:0 auto}
  .lv{aspect-ratio:1;padding:0;border-radius:14px;font-size:18px;font-weight:600;background:#2a2d47;color:#c5cbff;border:2px solid transparent;touch-action:manipulation}
  .lv.done{background:#33376a}
  .lv.sel{border-color:#8f98ff;background:#454b78;color:#fff}
  .lv.lock{opacity:.3}
  #lplay{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none}
  #lplay[hidden]{display:none}
  #lplay *{pointer-events:auto}
  #lplay .big{width:min(220px,60vw);flex-direction:row;justify-content:center;background:linear-gradient(180deg,#9aa3ff,#7f89f5);color:#1e1f2e;border-color:rgba(255,255,255,.3);box-shadow:0 4px 0 #4b53b8,0 10px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);padding:13px}
  #linfo{font-size:13px;opacity:.8;background:#1d1f2e;padding:2px 12px;border-radius:10px;pointer-events:none!important}
  .avwrap{position:relative;width:96px;height:96px;margin:4px auto 22px}
  .av{width:96px;height:96px;border-radius:50%;background:#2a2d47;display:flex;align-items:center;justify-content:center;font-size:48px;padding:0;border:2px solid rgba(165,175,255,.25)}
  .avedit{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#8f98ff;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .avedit svg{width:15px;height:15px;stroke:#1e1f2e;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .list{max-width:420px;margin:0 auto 16px;background:#2a2d47;border-radius:18px;overflow:hidden}
  .li{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border-radius:0;padding:16px 18px;font-size:16px;color:#e4e6ff;text-align:left;border-top:1px solid rgba(165,175,255,.1)}
  .li:first-child{border-top:0}
  .li span{opacity:.6;font-size:15px}
  .li .chev{opacity:.5}
  .tg{width:46px;height:27px;border-radius:14px;background:#3c3d6c;position:relative;flex:0 0 auto;transition:background .18s}
  .tg::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#c5cbff;transition:transform .18s}
  .tg.on{background:#8f98ff}
  .tg.on::after{transform:translateX(19px);background:#fff}
  #profver{text-align:center;font-size:12px;letter-spacing:.08em;color:#8a8fc4;opacity:.6;margin-top:18px}
  #modal{position:fixed;inset:0;background:rgba(10,10,20,.85);display:flex;align-items:center;justify-content:center;z-index:30}
  #modal[hidden]{display:none}
  #modal .card{text-align:left}
  #modal .card h3{text-align:center}
  #modal .card p{margin:0;font-size:14px;line-height:1.5;opacity:.85}
  #modal .card input{text-transform:none;letter-spacing:0;font-size:17px}
  #modal .card{max-height:82vh;overflow:auto}
  #cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ci{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:rgba(165,175,255,.1);border:1.5px solid var(--rc)}
  .ci b{font-size:28px;line-height:1.2;font-weight:400}
  .ci small{font-size:10px;opacity:.75;text-align:center}
  .ci.no{border-color:transparent}
  .ci.no b{opacity:.35;font-size:24px;line-height:1.4}
  #endcard.bare,html[data-theme=light] #endcard.bare{background:transparent}
  #endcard.bare .card,html[data-theme=light] #endcard.bare .card{background:none;box-shadow:none;width:auto;padding:0}
  #endcard.bare .ebig{font-size:84px}
  #endcard.bare h3{font-size:30px;text-shadow:0 2px 14px rgba(0,0,0,.55)}
  #endcard.bare #esub{text-shadow:0 2px 10px rgba(0,0,0,.55)}
  .btns{display:flex;gap:12px;margin-top:6px}
  .card h3{font-size:20px}
  #endcard .card{gap:14px}
  .ebig{margin-bottom:2px}
  #popts{gap:12px}
  .btns button{flex:1 1 0;min-width:0;padding:14px 8px;font-size:16px}
  .btns button[hidden]{display:none}
  #avopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  #avopts button{font-size:28px;padding:8px 0;border-radius:12px}

  html[data-theme=light],html[data-theme=light] body{background:#f1f2fb;color:#2a2d47;color-scheme:light}
  html[data-theme=light] select,html[data-theme=light] button,html[data-theme=light] input{background:#e2e4f6;color:#2a2d47}
  html[data-theme=light] button:active{background:#d0d3ee}
  html[data-theme=light] .pl{border-color:rgba(60,70,160,.35)}
  html[data-theme=light] .pl.solo svg,html[data-theme=light] .ib svg{stroke:#2a2d47}
  html[data-theme=light] .pl.solo .dv{background:rgba(60,70,160,.35)}
  html[data-theme=light] .row button{background:#dfe2f5}
  html[data-theme=light] .row #back{background:none}
  html[data-theme=light] .row #back svg{stroke:#2a2d47}
  html[data-theme=light] .hl svg{stroke:#6a72b8}
  html[data-theme=light] .card{background:#fff;color:#2a2d47;box-shadow:0 10px 30px rgba(40,50,120,.18)}
  html[data-theme=light] #lobby,html[data-theme=light] #picker,html[data-theme=light] #modal{background:rgba(241,242,251,.88)}
  html[data-theme=light] #endcard{background:rgba(241,242,251,.85)}
  html[data-theme=light] .opt.on{background:#d5d9fb;border-color:#5b66e8}
  html[data-theme=light] .primary{background:#5b66e8;color:#fff}
  html[data-theme=light] .scr,html[data-theme=light] #splash{background:#f1f2fb}
  html[data-theme=light] .homebox h1,html[data-theme=light] .stitle{color:#2a2d47}
  html[data-theme=light] .big{background:linear-gradient(180deg,#fff,#e6e8fa);color:#2a2d47;border-color:rgba(60,70,160,.2);box-shadow:0 4px 0 #b9bfe6,0 10px 20px rgba(40,50,120,.15),inset 0 1px 0 #fff}
  html[data-theme=light] .big:active{box-shadow:0 1px 0 #b9bfe6,0 3px 8px rgba(40,50,120,.15)}
  html[data-theme=light] #lplay .big{background:linear-gradient(180deg,#7a84f5,#5b66e8);color:#fff;box-shadow:0 4px 0 #3b44b0,0 10px 20px rgba(40,50,120,.25),inset 0 1px 0 rgba(255,255,255,.35)}
  html[data-theme=light] #linfo{background:#f1f2fb}
  html[data-theme=light] #tabs{background:#fff;box-shadow:0 8px 24px rgba(40,50,120,.18)}
  html[data-theme=light] .tab{color:#7a80b0;background:none}
  html[data-theme=light] .tab.on{color:#5b66e8;background:rgba(91,102,232,.12)}
  html[data-theme=light] .lv{background:#fff;color:#2a2d47}
  html[data-theme=light] .lv.done{background:#dfe2f8}
  html[data-theme=light] .lv.sel{background:#d5d9fb;border-color:#5b66e8;color:#2a2d47}
  html[data-theme=light] .av{background:#fff;border-color:rgba(60,70,160,.25)}
  html[data-theme=light] .avedit{background:#5b66e8}
  html[data-theme=light] .avedit svg{stroke:#fff}
  html[data-theme=light] .list{background:#fff}
  html[data-theme=light] .li{background:none;color:#2a2d47;border-top-color:rgba(60,70,160,.1)}
  html[data-theme=light] .tg{background:#cfd3ee}
  html[data-theme=light] .tg.on{background:#5b66e8}
  html[data-theme=light] #profver{color:#6a70a8}
  html[data-theme=light] #lmsg{color:#d6334a}
  html[data-theme=light] #avopts button{background:#eceefb}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <button id="back" class="ib" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M12 3 L4 12 L12 21 M21 3 L13 12 L21 21"/></svg></button>
      <button id="new" class="ib" aria-label="Restart"><svg viewBox="0 0 26 24"><path d="M20 12a7 7 0 1 1-2.4-5.3M19 3v5h-5"/></svg></button>
      <div id="players"></div>
      <button id="diffBtn" class="pill"></button>
      <button id="modeBtn" class="pill"></button>
      <button id="hint" class="ib" aria-label="Hint">&#128161;</button>
      <select id="diff" hidden>
        <option selected>Medium</option><option>Hard</option><option>Nightmare</option>
      </select>
      <select id="mode" hidden>
        <option value="1">Solo</option>
        <option value="online">Online co-op</option>
      </select>
    </div>
        <div id="status"></div>
    <div id="roomline"></div>
  </header>
  <div id="wrap"><canvas id="c"></canvas></div>
</div>

<div id="lobby" hidden>
  <div class="card">
    <h3>Online co-op</h3>
    <button id="create">Create room</button>
    <div>or enter a friend's code</div>
    <input id="code" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off">
    <button id="join">Join room</button>
    <p id="lmsg"></p>
    <button id="cancel">Back</button>
  </div>
</div>

<div id="picker" hidden>
  <div class="card">
    <h3 id="ptitle"></h3>
    <div id="popts"></div>
    <button id="pcancel">Close</button>
  </div>
</div>

<div id="flash"></div>

<div id="endcard" hidden>
  <div class="card">
    <div class="ebig" id="etrophy"></div>
    <h3 id="etitle"></h3>
    <p id="esub"></p>
    <div class="btns"><button id="enew" class="primary">New game</button>
    <button id="ehome">Go to home</button></div>
  </div>
</div>

<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 512 512">
    <g class="a1"><path d="M147 232 L255 340" stroke="#c5c9ff" stroke-width="24" fill="none"/><path d="M276 310 L225 361 L276 361 Z" fill="#c5c9ff"/></g>
    <g class="a2"><path d="M355 284 L248 177" stroke="#9aa3ff" stroke-width="24" fill="none"/><path d="M278 156 L227 207 L227 156 Z" fill="#9aa3ff"/></g>
  </svg>
</div>

<div id="home" class="scr" hidden>
  <div class="homebox">
    <svg class="logo" viewBox="130 140 240 240" aria-hidden="true"><path d="M147 232 L255 340" stroke="#c5c9ff" stroke-width="24" fill="none"/><path d="M276 310 L225 361 L276 361 Z" fill="#c5c9ff"/><path d="M355 284 L248 177" stroke="#9aa3ff" stroke-width="24" fill="none"/><path d="M278 156 L227 207 L227 156 Z" fill="#9aa3ff"/></svg>
    <h1>Arrow Escape</h1>
    <button class="big" data-m="1">Solo<small>Quick random game</small></button>
    <button class="big" data-m="online">Online co-op<small>Play with a friend</small></button>
  </div>
</div>

<div id="levels" class="scr" hidden>
  <div class="stitle">Levels</div>
  <div id="lgrid"></div>
</div>
<div id="lplay" hidden><div id="linfo"></div><button class="big" id="lgo">Play</button></div>

<div id="profile" class="scr" hidden>
  <div class="stitle">Profile</div>
  <div class="avwrap"><button class="av" id="avbtn" aria-label="Change avatar"></button><div class="avedit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></div></div>
  <div class="list">
    <button class="li" id="nameRow">Username<span id="nameVal"></span></button>
  </div>

<script>
const DIRS = [[0,-1],[0,1],[-1,0],[1,0]];

/* ---------- prefs, progress, sound ---------- */
const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const prefs = Object.assign({name:'Player', avatar:'\uD83D\uDE42', vib:false, snd:false, dark:true}, store.get('arrow-prefs', {}));
const savePrefs = () => store.set('arrow-prefs', prefs);
const haptic = p => { if (prefs.vib) try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };
let actx = null;
function tone(f, t0, d, type, v){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, actx.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(v || 0.12, actx.currentTime + t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t0 + d);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + d + 0.02);
}
function sfx(kind){
  if (!prefs.snd) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    if (kind === 'ok') tone(720, 0, .09, 'sine');
    else if (kind === 'bad'){ tone(170, 0, .18, 'square', .07); }
    else if (kind === 'win') [523,659,784,1047].forEach((f,i) => tone(f, i*.11, .22, 'triangle'));
    else if (kind === 'lose'){ tone(330, 0, .2, 'triangle'); tone(247, .18, .3, 'triangle'); }
  } catch(e){}
}


/* ---------- collection: exclusive items that can drop when you win a level ---------- */
const ITEMS = [
  ['fox','\uD83E\uDD8A','Fox','Common'],['panda','\uD83D\uDC3C','Panda','Common'],['frog','\uD83D\uDC38','Frog','Common'],['cat','\uD83D\uDC31','Cat','Common'],
  ['dog','\uD83D\uDC36','Dog','Common'],['bunny','\uD83D\uDC30','Bunny','Common'],['owl','\uD83E\uDD89','Owl','Common'],['bee','\uD83D\uDC1D','Bee','Common'],
  ['tiger','\uD83D\uDC2F','Tiger','Rare'],['lion','\uD83E\uDD81','Lion','Rare'],['octopus','\uD83D\uDC19','Octopus','Rare'],['whale','\uD83D\uDC33','Whale','Rare'],
  ['rocket','\uD83D\uDE80','Rocket','Rare'],['robot','\uD83E\uDD16','Robot','Rare'],['alien','\uD83D\uDC7E','Alien','Epic'],['unicorn','\uD83E\uDD84','Unicorn','Epic'],
  ['dragon','\uD83D\uDC09','Dragon','Epic'],['diamond','\uD83D\uDC8E','Diamond','Epic'],['crown','\uD83D\uDC51','Crown','Legendary'],['trophy','\uD83C\uDFC6','Golden Trophy','Legendary']
];
const RARITY = {Common:{w:60,c:'#8a8fc4'}, Rare:{w:25,c:'#4dd0ff'}, Epic:{w:11,c:'#c77dff'}, Legendary:{w:4,c:'#ffd166'}};
let owned = store.get('arrow-coll', []).filter(id => ITEMS.some(i => i[0] === id));
let lastDrop = null;
function rollDrop(){
  lastDrop = null;
  const left = ITEMS.filter(i => !owned.includes(i[0]));
  if (!left.length || Math.random() > 0.35) return;               // roughly 1 win in 3 drops something
  let r = Math.random() * left.reduce((t,i) => t + RARITY[i[3]].w, 0);
  for (const i of left){ r -= RARITY[i[3]].w; if (r <= 0){ lastDrop = i; break; } }
  lastDrop = lastDrop || left[left.length-1];
  owned.push(lastDrop[0]); store.set('arrow-coll', owned);
}

/* ---------- levels: endless, mixed difficulty, same board for everyone ---------- */
const LV_CYCLE = ['Medium','Medium','Hard','Medium','Hard','Medium','Hard','Hard','Medium','Nightmare'];
const levelDiff = n => LV_CYCLE[(n-1) % LV_CYCLE.length];
let lvBoard = 1;                                               // every play (and every retry) gets a brand new pattern
let levelMode = null;                                          // null = random solo / online, number = playing that level
let lvCur = Math.max(1, store.get('arrow-level', 1) | 0);      // highest unlocked level
let lvSel = lvCur, lastWin = false;
const SIZES = {Medium:14, Hard:22, Nightmare:34};
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

let N, cs, occ, arrows, players, turn, over, total, removed, maxH = 3, hintId = -1, flashes = [], anims = [];
// online state
let fb = null, room = null, role = null, team = null, gen = 0, applied = 0, gameBase = '';
let roomUnsubs = [], gameUnsubs = [];

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* ---------- puzzle generation (always solvable) ----------
   Arrows are placed one by one; each new arrow's exit ray must avoid every
   arrow already placed. Same seed => same board on every phone. */
function genClassic(n, rng = Math.random){
  const R = m => Math.floor(rng()*m);
  const o = new Array(n*n).fill(-1), list = [];
  const free = (x,y) => x>=0 && y>=0 && x<n && y<n && o[y*n+x] === -1;
  const maxLen = Math.max(4, Math.round(n*0.9));
  let fails = 0;
  while (fails < n*n*6){
    const x = R(n), y = R(n);
    if (!free(x,y)) { fails++; continue; }
    const len = 2 + R(maxLen-1);
    const path = [[x,y]], own = new Set([y*n+x]);
    let last = null;
    while (path.length < len){
      const [cx,cy] = path[path.length-1];
      let opts = DIRS.filter(d => free(cx+d[0],cy+d[1]) && !own.has((cy+d[1])*n+cx+d[0]));
      if (!opts.length) break;
      let d = (last && rng() < 0.6 && opts.includes(last)) ? last : opts[R(opts.length)];
      last = d;
      path.push([cx+d[0], cy+d[1]]); own.add((cy+d[1])*n+cx+d[0]);
    }
    if (path.length < 2) { fails++; continue; }
    const [hx,hy] = path[path.length-1], [px,py] = path[path.length-2];
    const dx = hx-px, dy = hy-py;
    let cx = hx+dx, cy = hy+dy, ok = true;
    while (cx>=0 && cy>=0 && cx<n && cy<n){
      if (o[cy*n+cx] !== -1 || own.has(cy*n+cx)) { ok = false; break; }
      cx += dx; cy += dy;
    }
    if (!ok) { fails++; continue; }
    const id = list.length;
    path.forEach(([a,b]) => o[b*n+a] = id);
    list.push({id, path, dx, dy, alive:true});
  }
  return {o, list};
}

/* ---------- harder boards (Hard, Nightmare) ----------
   The grid is covered with many short snakes, a head end is chosen for each (favouring long
   rays that cross lots of other arrows), then the board is "peeled" exactly the way a player
   would clear it. Any arrow that could never get out is turned around, or removed.
   Result: few arrows are free at the start and the escape order is a long chain.
   Only rng() is used (no sort(), no Math.random), so both phones build the identical board. */
const HARD = {
  Hard:      {minLen:2, maxLen:6, straight:0.45, longBias:0.9, refill:2},
  Nightmare: {minLen:2, maxLen:6, straight:0.40, longBias:0.9, refill:2},
  Medium:    {minLen:2, maxLen:6, straight:0.50, longBias:0.95, refill:1}
};

function genDense(n, rng, cfg){
  const R = m => Math.floor(rng()*m);
  const own = new Array(n*n).fill(-1), all = [];
  const inb = (x,y) => x>=0 && y>=0 && x<n && y<n;
  const setDir = a => {
    const k = a.path.length;
    a.dx = a.path[k-1][0] - a.path[k-2][0]; a.dy = a.path[k-1][1] - a.path[k-2][1];
  };
  const rayLen = a => {
    let c = 0, x = a.path[a.path.length-1][0] + a.dx, y = a.path[a.path.length-1][1] + a.dy;
    while (inb(x,y)){ c++; x += a.dx; y += a.dy; }
    return c;
  };
  const shuffle = arr => { for (let i = arr.length-1; i > 0; i--){ const j = R(i+1), t = arr[i]; arr[i] = arr[j]; arr[j] = t; } };

  function cover(){                                       // fill every empty cell with short snakes
    const empty = [];
    for (let i = 0; i < n*n; i++) if (own[i] === -1) empty.push(i);
    shuffle(empty);
    for (const idx of empty){
      if (own[idx] !== -1) continue;
      const L = cfg.minLen + R(cfg.maxLen - cfg.minLen + 1);
      const path = [[idx % n, Math.floor(idx / n)]]; own[idx] = -2;
      let last = null;
      while (path.length < L){
        const cx = path[path.length-1][0], cy = path[path.length-1][1];
        const opts = DIRS.filter(d => inb(cx+d[0], cy+d[1]) && own[(cy+d[1])*n + cx+d[0]] === -1);
        if (!opts.length) break;
        const d = (last && opts.includes(last) && rng() < cfg.straight) ? last : opts[R(opts.length)];
        last = d; path.push([cx+d[0], cy+d[1]]); own[(cy+d[1])*n + cx+d[0]] = -2;
      }
      if (path.length >= 2){
        const a = {id:all.length, path, dx:0, dy:0, alive:true, fresh:true};
        all.push(a); path.forEach(([x,y]) => own[y*n+x] = a.id);
        continue;
      }
      own[idx] = -1;                                      // lonely cell: glue onto a neighbouring arrow's end, else leave empty
      const x = path[0][0], y = path[0][1];
      for (const d of DIRS){
        const nx = x+d[0], ny = y+d[1]; if (!inb(nx,ny)) continue;
        const q = own[ny*n+nx]; if (q < 0) continue;
        const P = all[q].path, e = P[P.length-1], f = P[0];
        if (e[0] === nx && e[1] === ny){ P.push([x,y]); own[idx] = q; break; }
        if (f[0] === nx && f[1] === ny){ P.unshift([x,y]); own[idx] = q; break; }
      }
    }
  }

  function orient(a){                                     // pick which end is the head
    setDir(a); const r1 = rayLen(a);
    a.path.reverse(); setDir(a); const r2 = rayLen(a);
    const revert = (rng() < cfg.longBias) ? r2 < r1 : rng() < 0.5;
    if (revert){ a.path.reverse(); setDir(a); }
    a.fresh = false;
  }

  function solve(){                                       // peel like a player; fix whatever can never leave
    const occ = own.slice();
    const exits = a => {
      let x = a.path[a.path.length-1][0] + a.dx, y = a.path[a.path.length-1][1] + a.dy;
      while (inb(x,y)){ const v = occ[y*n+x]; if (v !== -1 && v !== a.id) return false; x += a.dx; y += a.dy; }
      return true;
    };
    const clear = a => a.path.forEach(([x,y]) => occ[y*n+x] = -1);
    let left = all.filter(a => a.alive);
    while (left.length){
      let progress = true;
      while (progress){
        progress = false;
        const rest = [];
        for (const a of left){ if (exits(a)){ clear(a); progress = true; } else rest.push(a); }
        left = rest;
      }
      if (!left.length) break;
      shuffle(left);
      let fixed = false;
      for (const a of left){                              // turning an arrow around never changes what blocks others
        a.path.reverse(); setDir(a);
        if (exits(a)){ fixed = true; break; }
        a.path.reverse(); setDir(a);
      }
      if (!fixed){
        const a = left[0];                                // stuck for good: remove it
        a.alive = false; clear(a); a.path.forEach(([x,y]) => own[y*n+x] = -1);
        left = left.slice(1);
      }
    }
  }

  for (let round = 0; round <= cfg.refill + 12; round++){ // later rounds refill the holes left by removed arrows
    cover();
    for (const a of all) if (a.alive){ if (a.fresh) orient(a); else setDir(a); }
    solve();
    if (round >= cfg.refill && own.indexOf(-1) === -1) break;   // board full: no blank cells
  }
  const list = all.filter(a => a.alive).map((a,i) => ({id:i, path:a.path, dx:a.dx, dy:a.dy, alive:true}));
  const o = new Array(n*n).fill(-1);
  list.forEach(a => a.path.forEach(([x,y]) => o[y*n+x] = a.id));
  return {o, list};
}

function generate(n, rng = Math.random, lvl = 'Medium'){
  return HARD[lvl] ? genDense(n, rng, HARD[lvl]) : genClassic(n, rng);
}

function canExit(a){
  const [hx,hy] = a.path[a.path.length-1];
  let x = hx+a.dx, y = hy+a.dy;
  while (x>=0 && y>=0 && x<N && y<N){
    const v = occ[y*N+x];
    if (v !== -1 && v !== a.id) return false;
    x += a.dx; y += a.dy;
  }
  return true;
}

function loadBoard(g){
  occ = g.o; arrows = g.list; total = arrows.length; removed = 0;
  over = false; hintId = -1; flashes = []; anims = [];
  hideEnd();
  layout();
}

function removeArrow(a, delay = 0){
  a.alive = false;
  a.path.forEach(([x,y]) => occ[y*N+x] = -1);
  const total = (a.path.length - 1) + N + 1;       // cells the tail must travel to be fully out
  anims.push({a, t0: performance.now() + delay, dur: 250 + total*14, total, red: !!a.red});
  removed++;
}

// A blocked arrow stays red. After every board change, any red arrow whose way is now
// clear leaves by itself (chains cascade). Deterministic, so online phones agree.
function sweepRed(credit){
  let step = 0, any = true;
  while (any){
    any = false;
    for (const a of arrows){
      if (a.alive && a.red && canExit(a)){
        removeArrow(a, step*130);
        credit(a);
        any = true;
      }
    }
    step++;
  }
}

function flashScreen(){
  const f = $('flash');
  f.style.transition = 'none'; f.style.opacity = '.22';
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = 'opacity .45s'; f.style.opacity = '0'; }));
}

/* ---------- local game (solo / same screen) ---------- */
function newGame(){
  const lv = levelMode != null, m = $('mode').value;
  if (lv) $('diff').value = levelDiff(levelMode);
  const diff = $('diff').value;
  refreshPills();
  if (m === 'online') return;
  if (!lv) store.set('arrow-settings', {diff, mode:m});
  N = SIZES[diff]; maxH = 3;
  loadBoard(generate(N, lv ? mulberry32(lvBoard) : Math.random, diff));
  const count = +m;
  players = Array.from({length:count}, (_,i) => ({name: count===1 ? 'You' : 'Player '+(i+1), hearts:3, score:0}));
  turn = 0; team = null;
  updateUI();
  setStatus(count===1 ? 'Tap an arrow to slide it out.' : 'Player 1 starts. Right move = keep your turn. Blocked = lose a heart and the turn passes.');
}

/* ---------- view: fit to screen, zoom and pan ---------- */
let view = {s:1, ox:0, oy:0}, W = 0, H = 0, DPR = 1;
const MINZ = 0.5;                                  // zoom out to half the fit-to-screen size
const maxScale = () => Math.max(3, 70/cs);          // zoom in: 3x on small boards, up to ~6x on Nightmare

function clampView(){
  const size = N*cs*view.s;
  view.ox = size <= W ? (W-size)/2 : Math.min(0, Math.max(W-size, view.ox));
  view.oy = size <= H ? (H-size)/2 : Math.min(0, Math.max(H-size, view.oy));
}

function layout(reset = true){
  const wrap = $('wrap');
  W = wrap.clientWidth || 300; H = wrap.clientHeight || 300;
  DPR = window.devicePixelRatio || 1;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cs = Math.max((Math.min(W,H) - 12) / N, 4);        // whole board fits any screen
  view.s = reset ? 1 : Math.min(maxScale(), Math.max(MINZ, view.s));
  clampView();
}

function zoomAt(cx, cy, ns){
  ns = Math.min(maxScale(), Math.max(MINZ, ns));
  const wx = (cx - view.ox)/(view.s*cs), wy = (cy - view.oy)/(view.s*cs);
  view.s = ns; view.ox = cx - wx*ns*cs; view.oy = cy - wy*ns*cs;
  clampView();
}

function setStatus(t){ $('status').textContent = t; }

const hbState = {};
function updateUI(){
  const OUTLINE = '<svg viewBox="0 0 24 22"><path d="M12 20.5C5 15 2 11.5 2 7.6 2 4.8 4.200 2.800 6.800 2.800c2 0 3.600 1.100 5.200 3.200 1.600-2.100 3.200-3.200 5.200-3.200 2.600 0 4.800 2 4.800 4.800 0 3.900-3 7.400-10 12.900z"/></svg>';
  const H = (n, key) => {                                  // hearts you have, then an outline where each lost one was; a fresh loss breaks first
    const hs = hbState[key] || (hbState[key] = {n, t:0, c:0});
    if (n < hs.n){ hs.t = Date.now(); hs.c = hs.n - n; } else if (n > hs.n) hs.c = 0;
    hs.n = n;
    const el = Date.now() - hs.t, fresh = hs.c && el < 1200;
    let out = '<span class="hf">❤️</span>'.repeat(Math.max(n,0));
    for (let k = Math.max(n,0); k < maxH; k++){
      const breaking = fresh && k < n + hs.c;
      out += `<span class="hl${breaking ? ' fx' : ''}"${breaking ? ` style="--d:-${el}ms"` : ''}>${OUTLINE}${breaking ? '<i>💔</i>' : ''}</span>`;
    }
    return `<span class="hrow">${out}</span>`;
  };
  if (room && team){
    const me = role==='h' ? team.h : team.g, fr = role==='h' ? team.g : team.h;
    $('players').innerHTML = `<div class="pl on"><b>Team · You ${me} · Friend ${fr}</b><span class="hearts">${H(team.hearts,'team')}</span></div>`;
  } else if (players && players.length === 1){
    $('players').innerHTML = `<div class="pl solo on"><span class="hearts">${H(players[0].hearts,'p0')}</span></div>`;
  } else if (players){
    $('players').innerHTML = players.map((p,i) =>
      `<div class="pl ${i===turn && !over ? 'on':''}"><b>${p.name} · ${p.score}</b><span class="hearts">${H(p.hearts,'p'+i)}</span></div>`
    ).join('');
  }
}

function nextTurn(){
  for (let i=1; i<=players.length; i++){
    const j = (turn+i) % players.length;
    if (players[j].hearts > 0) { turn = j; return true; }
  }
  return false;
}

function tap(a){
  if (over) return;
  if (room) return onlineTap(a);
  hintId = -1;
  if (a.red) return;                       // already blocked, waiting for its way to clear
  if (canExit(a)){
    removeArrow(a); sfx('ok');
    players[turn].score++;
    sweepRed(b => players[b.by].score++);
    if (removed === total) return finish();
    setStatus(players.length>1 ? players[turn].name+': good, go again.' : '');
  } else {
    a.red = true; a.by = turn;
    flashes.push({id:a.id, t0:performance.now()});
    flashScreen();
    haptic(60); sfx('bad');
    players[turn].hearts--;
    if (players.length === 1){
      if (players[0].hearts === 0) return finish(true);
      setStatus('Blocked! It stays red and leaves by itself once its way is clear.');
    } else {
      const was = players[turn].name;
      if (!nextTurn()) return finish(true);
      setStatus(was+' hit a blocked arrow. '+players[turn].name+"'s turn.");
    }
  }
  updateUI();
}

function finish(lost){
  over = true; updateUI();
  lastWin = !lost; lastDrop = null;
  const firstClear = levelMode != null && !lost && levelMode >= lvCur;     // collectibles drop only the first time a level is cleared
  if (firstClear){ rollDrop(); lvCur = levelMode + 1; store.set('arrow-level', lvCur); }
  if (players.length === 1){
    setStatus(lost ? 'Out of hearts. Tap New to try again.' : 'Cleared! Tap New for another board.');
    const hl = players[0].hearts;
    if (lost) showEnd(false, 'You Lost', '', 700);
    else showEnd(true, 'Congratulations! You Won', '', 800);
  } else {
    const best = Math.max(...players.map(p=>p.score));
    const w = players.filter(p=>p.score===best);
    setStatus(w.length>1 ? "It's a draw! "+best+' each.' : w[0].name+' wins with '+best+' arrows!');
    const scores = players.map(p => `${p.name} ${p.score}`).join(' \u00B7 ');
    if (lost) showEnd(false, 'You Lost', '', 700);
    else showEnd(true, w.length>1 ? "Congratulations! It's a draw" : 'Congratulations! '+w[0].name+' Won', '', 800);
  }
}

/* ---------- result card, confetti and home screen ---------- */
const cf = $('confetti'), cfx = cf.getContext('2d');
let parts = [], cfRAF = 0, cfLast = 0, endTimer = 0, nextTimer = 0;
const PRAISE = ['Marvelous!','Gorgeous!','Excellent!','Great!','Brilliant!','Fantastic!','Superb!','Awesome!','Perfect!','Amazing!'];

function stopConfetti(){
  cancelAnimationFrame(cfRAF); cfRAF = 0; cfLast = 0; parts = [];
  cfx.setTransform(1,0,0,1,0,0); cfx.clearRect(0,0,cf.width,cf.height);
}

function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  stopConfetti();
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  cf.width = Math.round(w*dpr); cf.height = Math.round(h*dpr);
  cf.style.width = w+'px'; cf.style.height = h+'px';
  cfx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#ff4b5c','#ffd166','#5dffb0','#8f98ff','#ff9ff3','#4dd0ff'];
  const add = (x, y, vx, vy, delay) => parts.push({x, y, vx, vy, w:6+Math.random()*7, h:3+Math.random()*5,
    rot:Math.random()*6.28, vr:(Math.random()-.5)*.4, c:cols[Math.floor(Math.random()*cols.length)],
    t:-delay, life:2600+Math.random()*1500});
  for (let i = 0; i < 60; i++){                                  // two cannons from the bottom corners
    const a = Math.PI*(0.25 + Math.random()*0.22), sp = 15 + Math.random()*12;
    add(0,   h*0.9, Math.cos(a)*sp,  -Math.sin(a)*sp, Math.random()*150);
    add(w,   h*0.9, -Math.cos(a)*sp, -Math.sin(a)*sp, Math.random()*150);
  }
  for (let i = 0; i < 70; i++) add(Math.random()*w, -20 - Math.random()*h*0.3, (Math.random()-.5)*2, 2 + Math.random()*3, 300 + Math.random()*1200);
  cfRAF = requestAnimationFrame(confettiLoop);
}

function confettiLoop(now){
  const dt = Math.min(40, cfLast ? now - cfLast : 16); cfLast = now;
  const k = dt/16.7;
  cfx.clearRect(0, 0, innerWidth, innerHeight);
  let alive = 0;
  for (const p of parts){
    p.t += dt;
    if (p.t < 0){ alive++; continue; }
    if (p.t > p.life) continue;
    alive++;
    p.vy += 0.32*k; p.vx *= Math.pow(0.992, k);
    p.x += p.vx*k; p.y += p.vy*k; p.rot += p.vr*k;
    cfx.save(); cfx.globalAlpha = Math.min(1, (p.life-p.t)/600);
    cfx.translate(p.x, p.y); cfx.rotate(p.rot); cfx.fillStyle = p.c;
    cfx.fillRect(-p.w/2, -p.h/2, p.w, p.h); cfx.restore();
  }
  if (alive) cfRAF = requestAnimationFrame(confettiLoop); else stopConfetti();
}

/* ---------- online co-op (Firebase Realtime Database) ----------
   Host is the referee: guest taps go to /taps, host decides ok/blocked and
   writes the result to /events, and both phones apply events in order. */
async function loadFirebase(){
  if (fb) return fb;
  if (!navigator.onLine) throw new Error('You are offline. Online co-op needs internet. Solo still works!');
  let cfg;
  try { cfg = (await import('./firebase-config.js')).default; }
  catch(e){ throw new Error('firebase-config.js is missing.'); }
  if (!cfg || !cfg.databaseURL || /PASTE/.test(cfg.databaseURL)) throw new Error('Firebase is not set up yet. Fill in firebase-config.js.');
  const V = 'https://www.gstatic.com/firebasejs/10.14.1/';
  let app, dbm;
  try { [app, dbm] = await Promise.all([import(V+'firebase-app.js'), import(V+'firebase-database.js')]); }
  catch(e){ throw new Error('Could not reach the server. Check your internet.'); }
  fb = Object.assign({}, dbm, { db: dbm.getDatabase(app.initializeApp(cfg)) });
  return fb;
}

const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const makeCode = () => Array.from({length:5}, () => CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const newSeed = () => Math.floor(Math.random()*2147483647);
const lmsg = t => $('lmsg').textContent = t;

async function createRoom(){
  const f = await loadFirebase();
  let code = makeCode();
  for (let i=0; i<5; i++){
    const s = await f.get(f.ref(f.db, `rooms/${code}/meta`));
    if (!s.exists()) break;
    code = makeCode();
  }
  await f.set(f.ref(f.db, `rooms/${code}/meta`), {seed:newSeed(), size:SIZES[$('diff').value], lvl:$('diff').value, gen:1, t:Date.now()});
  role = 'h'; room = code;
  enterRoom(f);
}

async function joinRoom(code){
  const f = await loadFirebase();
  const s = await f.get(f.ref(f.db, `rooms/${code}/meta`));
  if (!s.exists()) throw new Error('Room not found. Check the code.');
  role = 'g'; room = code;
  enterRoom(f);
}

function enterRoom(f){
  $('lobby').hidden = true;
  gen = 0; maxH = 5;
  const pref = f.ref(f.db, `rooms/${room}/players/${role}`);
  f.set(pref, true); f.onDisconnect(pref).remove();
  roomUnsubs.push(f.onValue(f.ref(f.db, `rooms/${room}/players`), s => {
    const p = s.val() || {};
    const other = role==='h' ? p.g : p.h;
    $('roomline').textContent = `Room ${room} · ${other ? 'Friend online' : (role==='h' ? 'Share this code, waiting for friend…' : 'Waiting for host…')}`;
  }));
  roomUnsubs.push(f.onValue(f.ref(f.db, `rooms/${room}/meta`), s => {
    const m = s.val();
    if (!m){ if (room){ setStatus('Room closed.'); leaveToSolo(); } return; }
    if (m.gen !== gen) startOnline(m);
  }));
}

function startOnline(m){
  const f = fb;
  gameUnsubs.forEach(u => u()); gameUnsubs = [];
  gen = m.gen; applied = 0; N = m.size; maxH = 5;
  team = {hearts:5, h:0, g:0};
  loadBoard(generate(N, mulberry32(m.seed), m.lvl));
  gameBase = `rooms/${room}/games/${gen}`;
  if (role === 'h'){
    gameUnsubs.push(f.onChildAdded(f.ref(f.db, gameBase+'/taps'), s => {
      const t = s.val(); if (t) hostProcess(t.id, t.by);
    }));
  }
  gameUnsubs.push(f.onChildAdded(f.ref(f.db, gameBase+'/events'), s => {
    const ev = s.val(); if (ev) applyEvent(ev);
  }));
  updateUI();
  setStatus('Co-op! Tap any free arrow. Blocked taps break a shared heart.');
}

function onlineTap(a){
  hintId = -1;
  if (!a.alive || a.red) return;
  if (role === 'h') hostProcess(a.id, 'h');
  else fb.push(fb.ref(fb.db, gameBase+'/taps'), {id:a.id, by:'g'});
}

function hostProcess(id, by){
  if (over) return;
  const a = arrows[id];
  if (!a || !a.alive || a.red) return;
  const ev = {n: applied+1, id, ok: canExit(a), by};
  applyEvent(ev);
  fb.push(fb.ref(fb.db, gameBase+'/events'), ev);
}

function applyEvent(ev){
  if (ev.n <= applied) return;
  applied = ev.n;
  const a = arrows[ev.id];
  if (!a || !a.alive) return;
  if (ev.ok){
    removeArrow(a); sfx('ok');
    team[ev.by]++;
    sweepRed(b => team[b.by]++);
    if (removed === total){
      over = true; updateUI();
      const me = role==='h' ? team.h : team.g, fr = role==='h' ? team.g : team.h;
      showEnd(true, 'Congratulations! You Won', '', 800);
      return setStatus(`Cleared together! You ${me} · Friend ${fr}. ${role==='h' ? 'Tap New for another board.' : 'Host can start the next one.'}`);
    }
  } else {
    if (a.red) return;
    a.red = true; a.by = ev.by;
    flashes.push({id:a.id, t0:performance.now()});
    flashScreen();
    haptic(60); sfx('bad');
    team.hearts--;
    if (team.hearts <= 0){
      over = true; updateUI();
      showEnd(false, 'You Lost', '', 700);
      return setStatus(`Out of hearts. Cleared ${removed} of ${total}. ${role==='h' ? 'Tap New to retry.' : 'Host can start a new game.'}`);
    }
    setStatus('Blocked! A shared heart broke. The red arrow leaves once its way is clear.');
  }
  updateUI();
}

async function restartOnline(){
  if (role !== 'h') return setStatus('Only the host can start a new game.');
  const f = fb, old = gen;
  await f.set(f.ref(f.db, `rooms/${room}/meta`), {seed:newSeed(), size:SIZES[$('diff').value], lvl:$('diff').value, gen:old+1, t:Date.now()});
  f.remove(f.ref(f.db, `rooms/${room}/games/${old}`)).catch(()=>{});
}

function leaveRoom(){
  roomUnsubs.forEach(u => u()); gameUnsubs.forEach(u => u());
  roomUnsubs = []; gameUnsubs = [];
  if (fb && room){
    try {
      const f = fb;
      if (role === 'h') f.remove(f.ref(f.db, `rooms/${room}`)).catch(()=>{});
      else f.remove(f.ref(f.db, `rooms/${room}/players/${role}`)).catch(()=>{});
    } catch(e){}
  }
  room = null; role = null; team = null; maxH = 3;
  $('roomline').textContent = '';
}

function leaveToSolo(){
  leaveRoom();
  $('mode').value = '1';
  newGame();
}

/* ---------- input ---------- */
let lastEmpty = null;
function handleTap(px, py){
  if (!arrows) return;
  const wx = (px - view.ox)/(view.s*cs), wy = (py - view.oy)/(view.s*cs);
  const ci = Math.floor(wx), cj = Math.floor(wy);
  let id = (ci>=0 && cj>=0 && ci<N && cj<N) ? occ[cj*N+ci] : -1;
  if (id === -1){                                   // forgiving taps: nearest line within finger reach
    const tol = Math.max(0.5, Math.min(0.7, 22/(view.s*cs)));
    let bd = 1e9;
    for (let j=cj-1; j<=cj+1; j++) for (let i=ci-1; i<=ci+1; i++){
      if (i<0||j<0||i>=N||j>=N || occ[j*N+i] === -1) continue;
      const d = Math.hypot(wx-(i+0.5), wy-(j+0.5));
      if (d < bd && d <= tol){ bd = d; id = occ[j*N+i]; }
    }
  }
  if (id === -1){                                   // double-tap empty space: zoom in / back to fit
    const now = performance.now();
    if (lastEmpty && now-lastEmpty.t < 350 && Math.hypot(px-lastEmpty.x, py-lastEmpty.y) < 40){
      if (Math.abs(view.s - 1) > 0.05){ view.s = 1; clampView(); } else zoomAt(px, py, Math.min(maxScale(), 2.6));
      lastEmpty = null;
    } else lastEmpty = {t:now, x:px, y:py};
    return;
  }
  tap(arrows[id]);
}

const ptrs = new Map(); let gest = null;
const local = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
const pair = () => { const [a,b] = [...ptrs.values()]; return {d: Math.hypot(a.x-b.x, a.y-b.y) || 1, m: {x:(a.x+b.x)/2, y:(a.y+b.y)/2}}; };

cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  const p = local(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) gest = {moved:false, t:performance.now(), sx:p.x, sy:p.y};
  else if (ptrs.size === 2){ gest = gest || {t:performance.now(), sx:p.x, sy:p.y}; gest.moved = true; Object.assign(gest, pair()); }
});
cv.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId); if (!prev) return;
  const p = local(e);
  if (ptrs.size === 1 && gest){
    if (!gest.moved && Math.hypot(p.x-gest.sx, p.y-gest.sy) > 8) gest.moved = true;
    if (gest.moved){ view.ox += p.x-prev.x; view.oy += p.y-prev.y; clampView(); }
    ptrs.set(e.pointerId, p);
  } else if (ptrs.size === 2 && gest){
    ptrs.set(e.pointerId, p);
    const {d, m} = pair();
    const ns = Math.min(maxScale(), Math.max(MINZ, view.s * d/gest.d));
    const wx = (gest.m.x - view.ox)/(view.s*cs), wy = (gest.m.y - view.oy)/(view.s*cs);
    view.s = ns; view.ox = m.x - wx*ns*cs; view.oy = m.y - wy*ns*cs; clampView();
    gest.d = d; gest.m = m;
  }
});
function endPtr(e, cancelled){
  const p = ptrs.get(e.pointerId); if (!p) return;
  const isTap = !cancelled && gest && !gest.moved && ptrs.size === 1 && performance.now()-gest.t < 600;
  ptrs.delete(e.pointerId);
  if (isTap) handleTap(p.x, p.y);
  if (ptrs.size === 0) gest = null;
  else if (gest) gest.moved = true;                  // finger left after a pinch: never counts as a tap
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const p = local(e);
  zoomAt(p.x, p.y, view.s * (e.deltaY < 0 ? 1.15 : 1/1.15));
}, {passive:false});

  }
};
$('cancel').onclick = () => { $('lobby').hidden = true; levelMode = null; leaveToSolo(); goHome(); };
async function lobbyAction(fn, btn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Connecting…'; lmsg('');
  try { await fn(); }
  catch(e){ lmsg(e.message || 'Something went wrong.'); room = null; role = null; }
  btn.disabled = false; btn.textContent = label;
}
$('create').onclick = () => pickDifficulty(() => lobbyAction(createRoom, $('create')));   // the host picks the difficulty
$('join').onclick = () => {
  const code = $('code').value.trim().toUpperCase();
  if (code.length !== 5) return lmsg('Enter the 5-character code.');
  lobbyAction(() => joinRoom(code), $('join'));
};
$('hint').onclick = () => {
  if (!arrows) return;
  const f = arrows.filter(a => a.alive && canExit(a));
  if (f.length) hintId = f[Math.floor(Math.random()*f.length)].id;
};
addEventListener('resize', () => { if (arrows) layout(false); });

/* ---------- drawing ---------- */
const RED = '#ff4b5c'; let BLUE = '#c5c9ff', GREEN = '#5dffb0', DOT = 'rgba(165,175,245,.4)';
const cellPts = a => a.path.map(([x,y]) => [x+0.5, y+0.5]);

function strokePoly(pts, dx, dy, color){
  const w = Math.max(1.6, cs*0.085);
  ctx.strokeStyle = ctx.fillStyle = color;
  ctx.lineWidth = w; ctx.lineJoin = ctx.lineCap = 'round';
  ctx.beginPath();
  pts.forEach(([x,y],i) => i ? ctx.lineTo(x*cs,y*cs) : ctx.moveTo(x*cs,y*cs));
  ctx.stroke();
  const px = pts[pts.length-1][0]*cs, py = pts[pts.length-1][1]*cs, s = cs*0.30;
  ctx.beginPath();
  ctx.moveTo(px+dx*s, py+dy*s);
  ctx.lineTo(px-dy*s*0.9-dx*s*0.2, py+dx*s*0.9-dy*s*0.2);
  ctx.lineTo(px+dy*s*0.9-dx*s*0.2, py-dx*s*0.9-dy*s*0.2);
  ctx.closePath(); ctx.fill();
}

function drawArrow(a, color, off){
  strokePoly(cellPts(a).map(([x,y]) => [x+a.dx*off, y+a.dy*off]), a.dx, a.dy, color);
}

// Snake exit: the head leaves straight in its pointing direction and the body follows
// the arrow's own path through every bend. s = how far the tail has travelled (in cells).
function snakePts(a, s){
  const base = cellPts(a), k = base.length - 1, hx = base[k][0], hy = base[k][1];
  const at = u => {
    if (u >= k) return [hx + a.dx*(u-k), hy + a.dy*(u-k)];
    const i = Math.floor(u), f = u - i;
    return [base[i][0] + (base[i+1][0]-base[i][0])*f, base[i][1] + (base[i+1][1]-base[i][1])*f];
  };
  const out = [at(s)];
  for (let i = 1; i <= k; i++) if (i > s && i < s+k) out.push(base[i]);
  out.push(at(s+k));
  return out;
}

function drawBoardBg(){
  const busy = new Uint8Array(N*N);                          // dots show only in cells with no arrow left
  for (const a of arrows) if (a.alive) for (const [x,y] of a.path) busy[y*N+x] = 1;
  ctx.fillStyle = DOT;
  const dr = Math.max(cs*0.05, 1/view.s);
  ctx.beginPath();
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++){
    if (busy[j*N+i]) continue;
    const x = (i+0.5)*cs, y = (j+0.5)*cs;
    ctx.moveTo(x+dr, y); ctx.arc(x, y, dr, 0, 6.2832);
  }
  ctx.fill();
}

function frame(now){
  if (arrows){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.setTransform(DPR*view.s,0,0,DPR*view.s,DPR*view.ox,DPR*view.oy);
    drawBoardBg();
    flashes = flashes.filter(f => now-f.t0 < 450);
    anims = anims.filter(an => now-an.t0 < an.dur);
    for (const a of arrows){
      if (!a.alive) continue;
      const fl = flashes.find(f => f.id === a.id);
      const color = a.red ? RED : (a.id === hintId ? GREEN : BLUE);
      drawArrow(a, color, fl ? Math.sin((now-fl.t0)/40)*0.08 : 0);
    }
    for (const an of anims){
      const t = Math.min(1, Math.max(0, (now-an.t0)/an.dur));
      strokePoly(snakePts(an.a, an.total*Math.pow(t,1.5)), an.a.dx, an.a.dy, an.red ? RED : BLUE);
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
{ const s = store.get('arrow-settings', null); if (s){ $('diff').value = SIZES[s.diff] ? s.diff : 'Medium'; $('mode').value = '1'; } }
refreshPills();                                     // no board is built at launch: Home shows first, a board is made when you press Play
requestAnimationFrame(frame);
const VERSION = '1.28.1'; $('profver').textContent = 'Version ' + VERSION;   // bump on every release
applyTheme();
showScreen('home');
(function(){
  const sp = $('splash'); let done = false;
  const end = () => { if (done) return; done = true; sp.classList.add('out'); setTimeout(() => sp.remove(), 450); };
  sp.addEventListener('pointerdown', end);
  setTimeout(end, matchMedia('(prefers-reduced-motion:reduce)').matches ? 300 : 560);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
